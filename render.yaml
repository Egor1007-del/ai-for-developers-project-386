services:
  - type: web
    name: calendar-calls
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: calendar-calls-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
