# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3
  <% if ENV['TEST_DATABASE_URL'].present? %>
  url: <%= ENV['TEST_DATABASE_URL'] %>
  <% end %>
  schema_dump: <%= (ENV['TEST_DATABASE_URL'].presence || ENV['DATABASE_URL']).to_s.match?(/\Apostgres(?:ql)?:/) ? 'structure.postgresql.sql' : 'structure.sql' %>

# The container can also start with a temporary SQLite database for checks.
production:
  <% if ENV['AUTONOMOUS_DATABASE'] == '1' %>
  adapter: sqlite3
  database: /tmp/calendar-autonomous.sqlite3
  timeout: 5000
  schema_dump: structure.sql
  <% else %>
  adapter: postgresql
  url: <%= ENV['DATABASE_URL'] %>
  schema_dump: structure.postgresql.sql
  <% end %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
